spring.application.name=LibraryManagementSystem
spring.datasource.url=jdbc:mysql://localhost:3306/librarymanagementsystem
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.devtools.restart.enabled=true

#email config
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MY_GMAIL}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#Payment integration
razorpay.key.id=your id 
razorpay.key.secret=your secret key
razorpay.callback.base-url=http://localhost:5173